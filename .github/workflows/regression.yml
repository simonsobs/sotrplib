name: Run regression tests

# Trigger the workflow on pushes and pull requests to the main branch, and on a daily schedule
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  runtest:
    env:
      UV_SYSTEM_PYTHON: 1
      FC: gfortran
      CXX: g++
      CC: gcc

    permissions:
      contents: read
      actions: read  # to download the baseline artifact from main

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync uv
        run: uv pip install pixell; uv pip install -e ".[dev,prefect]"

      - name: Run tests
        run: |
          cd tests/regression
          python validate_results.py
          cd -

      - name: Download baseline from main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Records BASELINE_STATUS so the report can say why a comparison
          # is missing: lookup-failed, no-run, download-failed, or ok.
          set +e
          # Latest successful push/scheduled run on main (excludes PR runs,
          # whose head branch could also be called "main" on a fork).
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow regression.yml \
            --branch main --status success --limit 20 --json databaseId,event \
            --jq '[.[] | select(.event == "push" or .event == "schedule")][0].databaseId // empty')
          if [ $? -ne 0 ]; then
            echo "BASELINE_STATUS=lookup-failed" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$run_id" ]; then
            echo "No baseline run found on main"
            echo "BASELINE_STATUS=no-run" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "BASELINE_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_ENV"
          if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name regression-results --dir baseline; then
            echo "BASELINE_STATUS=ok" >> "$GITHUB_ENV"
          else
            echo "BASELINE_STATUS=download-failed" >> "$GITHUB_ENV"
          fi

      - name: Write report
        if: ${{ !cancelled() && hashFiles('tests/regression/summary.json') != '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Unset means the download step died before recording an outcome.
            status="${BASELINE_STATUS:-unknown}"
          else
            status="not-applicable"
          fi
          mkdir -p report
          python tests/regression/report.py tests/regression/summary.json \
            --baseline baseline/summary.json \
            --baseline-status "$status" \
            --baseline-url "${BASELINE_URL:-}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output report/report.md
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.pull_request.number }}" > report/pr_number
          fi

      - name: Upload report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('report/report.md') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: regression-report
          path: report/

      - name: Upload regression results
        uses: actions/upload-artifact@v5
        with:
          name: regression-results
          path: |
            tests/regression/summary.json
            tests/regression/offset_ecdf.png
            tests/regression/profile.html
        